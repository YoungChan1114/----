<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>終於明白 | 黃宇琛 - Official Project</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @font-face {
            font-family: 'ChenYuluoyan';
            src: url('ChenYuluoyan-2.0-Thin.ttf') format('truetype');
        }

        :root {
            --sky-blue: #bae6fd;
            --main-blue: #3b82f6;
            --text: #334155;
            --hand: 'ChenYuluoyan', cursive;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            background-color: #fffdfc;
            color: var(--text);
            font-family: 'Noto Sans TC', sans-serif;
            overflow-x: hidden;
        }

        /* 1. 全域膠卷質感濾鏡 */
        .noise-overlay {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: url('https://www.transparenttextures.com/patterns/p6.png');
            opacity: 0.1; pointer-events: none; z-index: 9999;
        }

        /* 2. 音樂控制懸浮球 */
        .music-player {
            position: fixed; bottom: 30px; right: 30px; z-index: 1000;
            background: white; width: 50px; height: 50px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1); cursor: pointer;
            border: 1px solid #eee; transition: 0.3s;
        }
        .music-player:hover { transform: scale(1.1); }
        .music-player.playing { animation: rotate 5s linear infinite; border-color: var(--main-blue); }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* 3. 視覺首屏 */
        .hero {
            height: 100vh;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: linear-gradient(rgba(255,255,255,0.2), rgba(255,255,255,0.3)), 
                        url('600x600bf-60.jpg') center/cover fixed;
            text-align: center;
        }
        .hero h1 { font-family: var(--hand); font-size: 6rem; margin-bottom: 10px; color: #1e293b; }
        .hero p { font-family: var(--hand); font-size: 1.5rem; letter-spacing: 6px; color: var(--main-blue); }

        /* 4. 故事敘事區 */
        .section { max-width: 750px; margin: 0 auto; padding: 120px 25px; }

        .story-text {
            font-family: var(--hand); font-size: 1.8rem; line-height: 2; text-align: center;
            margin-bottom: 100px; color: #475569;
        }

        /* 互動劃線效果 */
        .reveal-ink {
            position: relative; color: transparent; cursor: help;
            transition: color 0.8s ease; display: inline-block;
        }
        .reveal-ink::after {
            content: ""; position: absolute; left: 0; bottom: 10px;
            width: 100%; height: 8px; background: #e2e8f0; z-index: -1;
            transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .reveal-ink:hover { color: #ef4444; }
        .reveal-ink:hover::after { width: 100%; background: #fee2e2; transform: scaleY(2); }

        /* 5. 歌詞滾動劇場 */
        .lyric-line {
            font-family: var(--hand); font-size: 2.2rem; margin: 40px 0;
            opacity: 0.2; transform: translateY(20px); transition: 1s;
            text-align: center;
        }
        .lyric-line.active { opacity: 1; transform: translateY(0); color: var(--main-blue); }

        /* 6. 宣傳連結區（功能核心） */
        .promo-card {
            background: #f8fafc; border-radius: 40px; padding: 60px 30px;
            text-align: center; margin-top: 50px; border: 1px solid #e2e8f0;
        }

        .platform-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 15px; margin: 40px 0;
        }

        .btn-main {
            display: flex; flex-direction: column; align-items: center;
            padding: 20px; background: white; border-radius: 20px;
            text-decoration: none; color: var(--text); border: 1px solid transparent;
            transition: 0.3s; box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }
        .btn-main:hover {
            transform: translateY(-5px); border-color: var(--main-blue);
            box-shadow: 0 15px 30px rgba(59, 130, 246, 0.1);
        }
        .btn-main i { font-size: 1.8rem; margin-bottom: 12px; }

        .share-toolbox {
            margin-top: 30px; display: flex; justify-content: center; gap: 10px;
        }
        .share-btn {
            background: #fff; border: 1px solid #ddd; padding: 10px 20px;
            border-radius: 50px; cursor: pointer; font-size: 0.8rem; transition: 0.3s;
        }
        .share-btn:hover { background: var(--text); color: #fff; }

    </style>
</head>
<body>

    <div class="noise-overlay"></div>

    <!-- 迷你播放器 (請替換 src 為你的音檔網址) -->
    <div class="music-player" onclick="togglePlay()" id="playerUI">
        <i class="fa-solid fa-play" id="playIcon"></i>
        <audio id="audio" src="你的音檔網址.mp3" loop></audio>
    </div>

    <!-- Hero -->
    <section class="hero">
        <h1>終於明白</h1>
        <p>HUANG YU CHEN</p>
    </section>

    <!-- Story Content -->
    <div class="section">
        <div class="story-text">
            其實愛意沒有消失，<br>
            只是從濃烈到悄無聲息。<br><br>
            但在旋律結束前，<br>
            留下了一個<span class="reveal-ink">遺憾的伏筆</span>。
        </div>

        <!-- 滾動歌詞 -->
        <div class="lyric-line">我早已明白，離開對你我都好</div>
        <div class="lyric-line">我終於明白，原來不曾擁有過</div>
        <div class="lyric-line">我想你該明白</div>
        <div class="lyric-line">需要抓住的，永遠不會屬於你</div>
    </div>

    <!-- 宣傳點閱區 -->
    <div class="section" id="listen">
        <div class="promo-card">
            <h2 style="font-family: var(--hand); font-size: 2.5rem; margin-bottom: 10px;">讓旋律收藏你的遺憾</h2>
            <p style="font-size: 0.9rem; color: #94a3b8;">選擇平台，立即點閱支持</p>

            <div class="platform-grid">
                <a href="https://streetvoice.com/yuchen0918/songs/775432/" class="btn-main">
                    <i class="fa-solid fa-bolt" style="color:#ff6000"></i>StreetVoice
                </a>
                <a href="https://open.spotify.com/album/0" class="btn-main">
                    <i class="fab fa-spotify" style="color:#1DB954"></i>Spotify
                </a>
                <a href="https://www.kkbox.com/tw/tc/album/N2.mBscWl4R5x7E99N" class="btn-main">
                    <i class="fa-solid fa-k" style="color:#00afb9"></i>KKBOX
                </a>
                <a href="https://music.apple.com/tw/album/終於明白/1739545585" class="btn-main">
                    <i class="fab fa-apple"></i>Apple Music
                </a>
            </div>

            <div class="share-toolbox">
                <button class="share-btn" onclick="copyLink()"><i class="fa-regular fa-copy"></i> 複製作品連結</button>
                <button class="share-btn" onclick="shareToFB()"><i class="fab fa-facebook"></i> 分享</button>
            </div>
        </div>
    </div>

    <script>
        // 1. 歌詞滾動偵測
        const lines = document.querySelectorAll('.lyric-line');
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('active');
                }
            });
        }, { threshold: 0.5 });

        lines.forEach(line => observer.observe(line));

        // 2. 音樂播放控制
        const audio = document.getElementById('audio');
        const icon = document.getElementById('playIcon');
        const ui = document.getElementById('playerUI');

        function togglePlay() {
            if (audio.paused) {
                audio.play();
                icon.className = "fa-solid fa-pause";
                ui.classList.add('playing');
            } else {
                audio.pause();
                icon.className = "fa-solid fa-play";
                ui.classList.remove('playing');
            }
        }

        // 3. 宣傳功能：複製連結
        function copyLink() {
            navigator.clipboard.writeText(window.location.href);
            alert("連結已複製，感謝支持作品！");
        }

        function shareToFB() {
            const url = `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(window.location.href)}`;
            window.open(url, '_blank');
        }
    </script>
</body>
</html>
